services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: galleria
    ports:
      - "3000:3000"
      # Optional for existing split-domain reverse proxies:
      # - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - DATA_DIR=/data
      - DOMAIN=${DOMAIN:-}
      - FRONTEND_DOMAIN=${FRONTEND_DOMAIN:-}
      - BACKEND_DOMAIN=${BACKEND_DOMAIN:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    volumes:
      - ${DATA_DIR:-~/galleria-data}:/data
    restart: unless-stopped
    # runtime: nvidia  # Uncomment if you have NVIDIA GPU + Container Toolkit
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
